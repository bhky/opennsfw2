services:
  opennsfw2-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - model_weights:/home/appuser/.opennsfw2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

volumes:
  model_weights:
